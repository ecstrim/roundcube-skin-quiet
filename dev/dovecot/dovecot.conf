## Dev-only Dovecot for the Quiet stack: plain IMAP with THREAD support (GreenMail has none).
## Replaces the image's default config (whose static passdb accepts any user).

protocols = imap
listen = *

mail_home = /srv/mail/%Lu
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%Lu /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}

# Same hierarchy delimiter as the GreenMail instance (folder Projects.Old).
namespace inbox {
  inbox = yes
  separator = .
}

service imap-login {
  process_min_avail = 1
}

log_path = /dev/stdout
info_log_path = /dev/stdout
