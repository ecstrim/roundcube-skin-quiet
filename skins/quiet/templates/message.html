<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" condition="!env:framed && !env:extwin" />

<roundcube:object name="mailboxlist" folder_filter="mail" type="js" />

<!-- labels for the message script below -->
<roundcube:add_label name="mark" />
<roundcube:add_label name="markunread" />
<roundcube:add_label name="flag" />
<roundcube:add_label name="markunflagged" />

<h1 class="voice"><roundcube:label name="arialabelmailpreviewframe" /></h1>

<div id="layout-content" class="selected">
	<roundcube:if condition="!env:framed" />
		<h2 id="aria-label-toolbar" class="voice"><roundcube:label name="arialabeltoolbar" /></h2>
		<div class="header" role="toolbar" aria-labelledby="aria-label-toolbar">
			<a class="button icon back-list-button" href="#back"><span class="inner"><roundcube:label name="back" /></span></a>
			<span class="header-title"></span>
			<roundcube:include file="includes/mail-menu.html" />
		</div>
	<roundcube:endif />
	<div class="content frame-content" role="main">
		<roundcube:if condition="!env:framed" />
		<div id="quiet-nav" role="navigation">
			<roundcube:button command="list" type="link" id="quiet-nav-back" class="quiet-act back" classAct="quiet-act back"
				label="back" title="back" innerclass="inner" />
			<span class="quiet-nav-pager">
				<roundcube:button command="previousmessage" type="link" id="quiet-nav-prev" class="quiet-act quiet-icononly prev disabled" classAct="quiet-act quiet-icononly prev"
					label="previousmessage" title="previousmessage" innerclass="inner" />
				<roundcube:button command="nextmessage" type="link" id="quiet-nav-next" class="quiet-act quiet-icononly next disabled" classAct="quiet-act quiet-icononly next"
					label="nextmessage" title="nextmessage" innerclass="inner" />
			</span>
		</div>
		<roundcube:endif />
		<div id="message-header">
			<div class="quiet-subject-row">
				<h2 class="subject">
					<span class="voice"><roundcube:label name="subject" />: </span>
					<roundcube:object name="messageHeaders" valueOf="subject" />
				</h2>
				<roundcube:button command="mark" prop="flagged" id="quiet-msg-flag" type="link"
					class="quiet-act quiet-icononly flag disabled" classAct="quiet-act quiet-icononly flag"
					label="flag" title="flag" innerClass="inner" data-quiet-cmd="flag" />
			</div>
			<div class="header quiet-sender">
				<div class="quiet-avatar" aria-hidden="true"></div>
				<div class="header-content">
					<div class="quiet-from"><roundcube:object name="messageHeaders" valueOf="from" addicon="virtual" /></div>
					<div class="quiet-meta">
						<span class="quiet-to"><roundcube:label name="to" />: <roundcube:object name="messageHeaders" valueOf="to" addicon="virtual" max="3" /></span>
						<span class="quiet-date"><roundcube:object name="messageHeaders" valueOf="date" /></span>
						<div class="header-links">
							<roundcube:add_label name="details" />
							<roundcube:add_label name="summary" />
							<a href="#headers" class="headers-summary" onclick="return UI.headers_show(true)"></a>
							<a href="#all-headers" class="headers-all" onclick="return UI.headers_dialog()"><roundcube:label name="headers" /></a>
							<roundcube:add_label name="arialabelmessageheaders" />
							<roundcube:if condition="env:optional_format=='text'" />
								<roundcube:button command="change-format" prop="text" type="link" class="plain" innerClass="inner"
									title="changeformattext" label="plaintoggle" />
							<roundcube:elseif condition="env:optional_format=='html'" />
								<roundcube:button command="change-format" prop="html" type="link" class="html" innerClass="inner"
									title="changeformathtml" label="htmltoggle" />
							<roundcube:endif />
							<roundcube:container name="headerlinks" id="header-links" />
						</div>
					</div>
					<roundcube:object name="messageSummary" class="header-summary" addicon="virtual" />
					<roundcube:object name="messageHeaders" class="header-headers" addicon="virtual" exclude="subject" max="10" />
				</div>
				<h3 id="quiet-aria-sender-actions" class="voice"><roundcube:label name="arialabelmessageactions" /></h3>
				<div id="quiet-sender-actions" role="toolbar" aria-labelledby="quiet-aria-sender-actions">
					<roundcube:button command="reply" type="link" id="quiet-s-reply" class="quiet-act reply disabled" classAct="quiet-act reply"
						label="reply" title="replytomessage" innerclass="inner" data-quiet-cmd="reply" />
					<roundcube:button command="reply-all" type="link" id="quiet-s-replyall" class="quiet-act quiet-icononly reply-all disabled" classAct="quiet-act quiet-icononly reply-all"
						label="replyall" title="replyall" innerclass="inner" data-quiet-cmd="reply-all" />
					<roundcube:button command="forward" type="link" id="quiet-s-forward" class="quiet-act quiet-icononly forward disabled" classAct="quiet-act quiet-icononly forward"
						label="forward" title="forward" innerclass="inner" data-quiet-cmd="forward" />
					<roundcube:button command="delete" type="link" id="quiet-s-delete" class="quiet-act danger delete disabled" classAct="quiet-act danger delete"
						label="delete" title="deletemessage" innerclass="inner" data-quiet-cmd="delete" />
				</div>
			</div>
		</div>
		<div id="message-content">
			<div id="quiet-attachments" class="leftcol" role="region" aria-labelledby="aria-label-messageattachments">
				<h2 id="aria-label-messageattachments" class="voice"><roundcube:label name="attachments" /></h2>
				<roundcube:object name="messageAttachments" id="attachment-list" class="attachmentslist" />
			</div>
			<div class="rightcol" role="region" aria-labelledby="aria-label-messagebody">
				<h2 id="aria-label-messagebody" class="voice"><roundcube:label name="arialabelmessagebody" /></h2>
				<roundcube:object name="messageObjects" id="message-objects" />
				<div id="quiet-body-box">
					<roundcube:object name="messageBody" id="messagebody" headertableclass="headers-table" />
				</div>
			</div>
		</div>
		<h3 id="quiet-aria-under-actions" class="voice"><roundcube:label name="arialabelmessageactions" /></h3>
		<div id="quiet-under-actions" role="toolbar" aria-labelledby="quiet-aria-under-actions">
			<div class="quiet-under-left">
				<a href="#archive" id="quiet-u-archive" role="button" class="quiet-act archive" data-quiet-cmd="plugin.archive" hidden><span class="inner"><roundcube:label name="quietarchive" /></span></a>
				<roundcube:button command="move" type="link" id="quiet-u-move" class="quiet-act move disabled" classAct="quiet-act move"
					label="moveto" title="moveto" innerclass="inner" data-quiet-cmd="move" aria-haspopup="true" />
				<roundcube:button command="mark" prop="unread" type="link" id="quiet-u-unread" class="quiet-act unread disabled" classAct="quiet-act unread"
					label="markunread" title="markunread" innerclass="inner" data-quiet-cmd="mark" data-quiet-prop="unread" />
				<roundcube:button command="print" type="link" id="quiet-u-print" class="quiet-act print disabled" classAct="quiet-act print"
					label="print" title="printmessage" innerclass="inner" data-quiet-cmd="print" />
				<roundcube:button command="download" type="link" id="quiet-u-download" class="quiet-act download disabled" classAct="quiet-act download"
					label="download" title="export" innerclass="inner" data-quiet-cmd="download" />
				<roundcube:button command="viewsource" type="link" id="quiet-u-source" class="quiet-act source disabled" classAct="quiet-act source"
					label="viewsource" title="viewsource" innerclass="inner" data-quiet-cmd="viewsource" />
				<roundcube:button name="quiet-more" id="quiet-u-more" type="link" class="quiet-act more"
					label="more" title="moreactions" innerclass="inner" data-popup="quiet-more-menu" aria-haspopup="true" />
			</div>
			<div class="quiet-under-right">
				<roundcube:button command="reply" type="link" id="quiet-u-reply" class="quiet-act reply disabled" classAct="quiet-act reply"
					label="reply" title="replytomessage" innerclass="inner" data-quiet-cmd="reply" />
				<roundcube:button command="reply-all" type="link" id="quiet-u-replyall" class="quiet-act reply-all disabled" classAct="quiet-act reply-all"
					label="replyall" title="replytoallmessage" innerclass="inner" data-quiet-cmd="reply-all" />
				<roundcube:button command="forward" type="link" id="quiet-u-forward" class="quiet-act forward disabled" classAct="quiet-act forward"
					label="forward" title="forwardmessage" innerclass="inner" data-quiet-cmd="forward" />
				<roundcube:button command="delete" type="link" id="quiet-u-delete" class="quiet-act danger delete disabled" classAct="quiet-act danger delete"
					label="delete" title="deletemessage" innerclass="inner" data-quiet-cmd="delete" />
			</div>
		</div>
	</div>
</div>

<!-- popup menus -->
<div id="attachmentmenu" class="popupmenu">
	<h3 id="aria-label-attachmentmenu" class="voice"><roundcube:label name="arialabelattachmentmenu" /></h3>
	<ul class="menu listing" role="menu" aria-labelledby="aria-label-attachmentmenu">
		<roundcube:button command="open-attachment" type="link-menuitem" id="attachmenuopen" label="open" class="extwin disabled" classAct="extwin active" />
		<roundcube:button command="download-attachment" type="link-menuitem" id="attachmenudownload" label="download" class="download disabled" classAct="download active" />
		<roundcube:container name="attachmentmenu" id="attachmentmenu" />
	</ul>
</div>

<div id="quiet-more-menu" class="popupmenu">
	<h3 id="aria-label-quiet-more-menu" class="voice"><roundcube:label name="arialabelmoremessageactions" /></h3>
	<ul class="menu listing" role="menu" aria-labelledby="aria-label-quiet-more-menu">
		<roundcube:button command="reply-list" type="link-menuitem" id="quiet-m-replylist" label="replylist" prop="sub" class="reply list disabled" classAct="reply list active" />
		<roundcube:button command="forward-inline" type="link-menuitem" id="quiet-m-fwdinline" label="forwardinline" prop="sub" class="forward inline disabled" classAct="forward inline active" />
		<roundcube:button command="forward-attachment" type="link-menuitem" id="quiet-m-fwdattach" label="forwardattachment" prop="sub" class="forward attachment disabled" classAct="forward attachment active" />
		<roundcube:button command="bounce" type="link-menuitem" id="quiet-m-bounce" label="bouncemsg" class="forward bounce disabled" classAct="forward bounce active" />
		<roundcube:button command="copy" type="link-menuitem" id="quiet-m-copy" label="copyto" class="copy disabled" classAct="copy active" innerclass="folder-selector-link" aria-haspopup="true" />
		<roundcube:button command="edit" prop="new" type="link-menuitem" id="quiet-m-edit" label="editasnew" class="edit asnew disabled" classAct="edit asnew active" />
		<roundcube:if condition="!env:message_context && !env:extwin" />
			<roundcube:button command="extwin" type="link-menuitem" id="quiet-m-extwin" label="openinextwin" class="extwin" data-hidden="small" />
		<roundcube:endif />
		<!-- Print, Download and Show source sit in the row under the box in full view; in the reading pane they fold in here (CSS shows one set) -->
		<roundcube:button command="print" type="link-menuitem" id="quiet-m-print" label="print" class="print quiet-m-dup disabled" classAct="print quiet-m-dup active" />
		<roundcube:button command="download" type="link-menuitem" id="quiet-m-download" label="download" class="download quiet-m-dup disabled" classAct="download quiet-m-dup active" />
		<roundcube:button command="viewsource" type="link-menuitem" id="quiet-m-source" label="viewsource" class="source quiet-m-dup disabled" classAct="source quiet-m-dup active" />
		<roundcube:container name="quietmoremenu" id="quiet-more-menu" />
	</ul>
</div>

<div id="mailto-menu" class="popupmenu">
	<h3 id="aria-label-mailtomenu" class="voice"><roundcube:label name="arialabelmailtomenu" /></h3>
	<ul class="menu listing" role="menu" aria-labelledby="aria-label-mailtomenu">
		<roundcube:button name="addtoaddressbook" type="link-menuitem" label="addtoaddressbook" class="addressbook" classAct="addressbook active" />
		<roundcube:button name="composeto" type="link-menuitem" label="composeto" class="compose" classAct="compose active" />
		<roundcube:container name="mailtomenu" id="mailto-menu" />
	</ul>
</div>

<roundcube:include file="includes/footer.html" />
<script src="/message.js"></script>
