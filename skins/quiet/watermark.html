<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
<style type="text/css">
/* Quiet: the empty content frame (Contacts, Settings) shows the pane through (transparent, so every colour
   scheme and mode matches) with a muted mark for the current task. */
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: rgba(128, 128, 128, .4);
}
svg { display: none; }
html.task-mail svg.mail, html.task-addressbook svg.contacts, html.task-settings svg.settings { display: block; }
</style>
<script>
  try {
    if (document.cookie.indexOf('colorMode=dark') > -1
      || (document.cookie.indexOf('colorMode=light') === -1 && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.className += ' dark-mode';
    }
  } catch (e) { }
  try { document.documentElement.className += ' task-' + (parent.rcmail.env.task || 'mail'); }
  catch (e) { document.documentElement.className += ' task-mail'; }
</script>
</head>
<body>
<svg class="mail" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
<svg class="contacts" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.2 0 3.9 1.5 4.5 4"/></svg>
<svg class="settings" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
</body>
</html>
